name: PressSport database connectivity (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify PostgreSQL access
        env:
          PGCONNECT_TIMEOUT: '10'
          PGSSLMODE: require
          PGDATABASE_URL: ${{ secrets.PRESSSPORT_DATABASE_URL }}
        run: |
          if [ -z "$PGDATABASE_URL" ]; then
            echo "BLOCKED: database secret missing"
            exit 1
          fi
          psql "$PGDATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "BEGIN READ ONLY; SELECT CASE WHEN to_regclass('presssport_internal.publication_reservations') IS NOT NULL THEN 'PASS: private reservation table found' ELSE 'BLOCKED: private reservation table missing' END; ROLLBACK;"
          echo "PUBLICATION: NOT PERFORMED"
