name: PressSport Meta transport tests
on:
  pull_request:
    paths:
      - 'scripts/presssport_meta_transport.py'
      - 'tests/test_presssport_meta_transport.py'
      - '.github/workflows/presssport-meta-transport-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_presssport_meta_transport -v
