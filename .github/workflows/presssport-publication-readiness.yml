name: PressSport Instagram publication readiness (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate approved manifest and caption
        run: python scripts/meta_publication_readiness.py
