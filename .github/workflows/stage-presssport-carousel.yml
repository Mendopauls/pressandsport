name: Stage approved PressSport carousel images
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-api-python-client google-auth Pillow
      - name: Download and verify seven approved PNGs
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/stage_presssport_carousel.py
      - name: Commit staged assets to current branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram-media/2026-10-28/
          if ! git diff --cached --quiet; then
            git commit -m "Stage approved PressSport carousel images (no Instagram publishing)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
