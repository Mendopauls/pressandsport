name: PressSport cloud publisher integrated dry run
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/presssport_cloud_publisher.py'
      - 'scripts/presssport_database_readonly.py'
      - 'scripts/presssport_ledger_reconciliation_readonly.py'
      - 'scripts/meta_identity_readonly.py'
      - 'publishing/**'
      - '.github/workflows/presssport-cloud-publisher-dryrun.yml'
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRESSSPORT_DATABASE_URL: ${{ secrets.PRESSSPORT_DATABASE_URL }}
      META_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_ACCESS_TOKEN }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Verify cloud dry-run integration without publication
        run: |
          mkdir -p verification-output
          python -m scripts.presssport_cloud_publisher > verification-output/cloud-verification.json
          cat verification-output/cloud-verification.json
      - name: Record verification summary
        if: success()
        run: |
          echo '## Press & Sport Cloud — read-only connectivity verified' >> "$GITHUB_STEP_SUMMARY"
          echo 'Meta account identity: verified; Supabase ledger: accessible.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No database writes or Meta POST calls. No publication performed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload read-only verification evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: presssport-cloud-readonly-verification
          path: verification-output/cloud-verification.json
          retention-days: 30
