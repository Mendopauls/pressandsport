name: PressSport multichannel v2 offline safety
on:
  pull_request:
    paths:
      - 'scripts/presssport_multichannel_*.py'
      - 'tests/test_presssport_multichannel_*.py'
      - 'supabase/migrations/20261031_presssport_multichannel_queue.sql'
      - '.github/workflows/presssport-multichannel-v2-tests.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate syntax
        run: python -m compileall -q scripts/presssport_multichannel_manifest.py scripts/presssport_multichannel_queue.py
      - name: Validate manifest tests
        run: python -m unittest tests.test_presssport_multichannel_manifest -v
