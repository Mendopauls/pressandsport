name: PressSport preproduction security audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline release safety audit
        run: python -m scripts.presssport_preproduction_audit
      - name: Offline regression suite
        run: python -m unittest discover -s tests -p 'test_publication_*.py' -q
