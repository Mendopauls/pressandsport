name: PressSport live Supabase transaction rollback probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: presssport-transaction-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRESSSPORT_DATABASE_URL: ${{ secrets.PRESSSPORT_DATABASE_URL }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Require publishing authorization disabled
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          auth=json.loads(Path("publishing/presssport-2026-10-28-authorization.json").read_text())
          if auth.get("publish_authorized") is not False:
              raise SystemExit("BLOCKED: publication authorization must be disabled")
          print("PASS: no publication authorized")
          PY
      - name: Test real database transactions with mandatory rollback
        run: python -m scripts.presssport_transaction_rollback_probe
