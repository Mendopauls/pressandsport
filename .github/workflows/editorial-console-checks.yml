name: PressSport editorial console checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'admin/console-v2-review.html'
      - 'tests/test_presssport_editorial_review_console.py'
      - 'supabase/migrations/**'
      - 'supabase/functions/presssport-ollama-sync/**'
      - 'supabase/functions/presssport-project-ai/**'
      - '.github/workflows/editorial-console-checks.yml'
  pull_request:
    paths:
      - 'admin/console-v2-review.html'
      - 'tests/test_presssport_editorial_review_console.py'
      - 'supabase/migrations/**'
      - 'supabase/functions/presssport-ollama-sync/**'
      - 'supabase/functions/presssport-project-ai/**'
      - '.github/workflows/editorial-console-checks.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run editorial review smoke tests
        run: python -m unittest discover -s tests -p 'test_presssport_editorial_review_console.py' -v
      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("admin/console-v2-review.html").read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html)
          assert scripts and any(s.strip() for s in scripts), "No inline JavaScript found"
          Path("/tmp/presssport-console.js").write_text("\n".join(scripts))
          PY
          node --check --input-type=module < /tmp/presssport-console.js
