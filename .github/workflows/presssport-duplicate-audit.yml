name: PressSport Instagram duplicate audit (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate manifest readiness
        run: python scripts/meta_publication_readiness.py
      - name: Check publication ledger
        run: python scripts/check_publication_ledger.py
