name: PressSport publication safety regression tests
on:
  push:
    paths:
      - 'scripts/meta_publication_readiness.py'
      - 'scripts/check_publication_ledger.py'
      - 'scripts/publication_ledger_state.py'
      - 'scripts/publication_reservation.py'
      - 'scripts/prepublish_guard.py'
      - 'scripts/publication_state_db.py'
      - 'scripts/check_publication_authorization.py'
      - 'publishing/**'
      - 'tests/test_publication_safety.py'
      - 'tests/test_publication_authorization.py'
      - 'tests/test_publication_ledger_state.py'
      - 'tests/test_publication_reservation_schema.py'
      - 'tests/test_publication_reservation_client.py'
      - 'tests/test_publication_prepublish_guard.py'
      - 'tests/test_publication_state_db.py'
      - 'sql/presssport_publication_reservations.sql'
      - '.github/workflows/presssport-publication-safety-tests.yml'
  pull_request:
    paths:
      - 'scripts/meta_publication_readiness.py'
      - 'scripts/check_publication_ledger.py'
      - 'scripts/publication_ledger_state.py'
      - 'scripts/publication_reservation.py'
      - 'scripts/prepublish_guard.py'
      - 'scripts/publication_state_db.py'
      - 'scripts/check_publication_authorization.py'
      - 'publishing/**'
      - 'tests/test_publication_safety.py'
      - 'tests/test_publication_authorization.py'
      - 'tests/test_publication_ledger_state.py'
      - 'tests/test_publication_reservation_schema.py'
      - 'tests/test_publication_reservation_client.py'
      - 'tests/test_publication_prepublish_guard.py'
      - 'tests/test_publication_state_db.py'
      - 'sql/presssport_publication_reservations.sql'
      - '.github/workflows/presssport-publication-safety-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_publication_*.py' -v
